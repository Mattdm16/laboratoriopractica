<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 190" role="img" aria-label="UNACH - Universidad Autónoma de Chiapas - 50 años">
  <rect width="1120" height="190" fill="#1c3f70"/>

  <!-- ESCUDO -->
  <g>
    <path d="M46,20 H134 V82 C134,120 110,146 90,154 C70,146 46,120 46,82 Z"
          fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M55,29 H125 V82 C125,115 105,138 90,145 C75,138 55,115 55,82 Z"
          fill="none" stroke="#ffffff" stroke-width="1.4" opacity=".7"/>
    <text x="90" y="68" font-family="Georgia,serif" font-size="26" font-weight="700"
          text-anchor="middle" fill="#ffffff">UNACH</text>
    <line x1="66" y1="80" x2="114" y2="80" stroke="#ffffff" stroke-width="1.6"/>
    <text x="90" y="100" font-family="Georgia,serif" font-size="9" text-anchor="middle"
          letter-spacing="1.4" fill="#ffffff" opacity=".9">CHIAPAS</text>
    <text x="90" y="176" font-family="Georgia,serif" font-size="11" text-anchor="middle"
          letter-spacing="3.2" font-weight="700" fill="#ffffff">AUTONOMA</text>
  </g>

  <!-- separador -->
  <line x1="164" y1="26" x2="164" y2="156" stroke="#ffffff" stroke-width="2.5" opacity=".5"/>

  <!-- 50 AÑOS -->
  <g>
    <text x="182" y="74" font-family="Georgia,serif" font-size="16" text-anchor="middle"
          letter-spacing="3.5" fill="#ffffff" transform="rotate(90 182 74)">AÑOS</text>
    <text x="274" y="102" font-family="Georgia,serif" font-size="86" font-weight="700"
          text-anchor="middle" letter-spacing="-3" fill="#ffffff">50</text>
    <text x="274" y="130" font-family="Georgia,serif" font-size="15" text-anchor="middle"
          letter-spacing="5" fill="#ffffff">UNACH</text>
    <rect x="234" y="137" width="80" height="2.4" fill="#ffffff"/>
  </g>

  <!-- separador -->
  <line x1="344" y1="26" x2="344" y2="156" stroke="#ffffff" stroke-width="2.5" opacity=".5"/>

  <!-- UNACH grande -->
  <text x="572" y="120" font-family="Georgia,'Times New Roman',serif" font-size="108"
        font-weight="600" text-anchor="middle" letter-spacing="6" fill="#ffffff">UNACH</text>

  <!-- separador -->
  <line x1="798" y1="26" x2="798" y2="156" stroke="#ffffff" stroke-width="2.5" opacity=".5"/>

  <!-- Nombre universidad -->
  <g font-family="Georgia,'Times New Roman',serif" font-style="italic" fill="#ffffff">
    <text x="822" y="62" font-size="36">Universidad</text>
    <text x="822" y="106" font-size="36">Autónoma</text>
    <text x="822" y="150" font-size="36">de Chiapas</text>
  </g>
</svg>
